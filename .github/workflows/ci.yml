name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhuifen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhuifen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zhuifen_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 自建服务器部署用的 compose 文件：检查格式，并确认引用的 Dockerfile 都存在。
      - name: Check production compose file
        env:
          DOMAIN: example.com
          POSTGRES_PASSWORD: ci-only
          DEPLOY_TAG: ci
        run: |
          docker compose -f compose.production.yaml -f compose.images.yaml config --quiet
          for file in $(docker compose -f compose.production.yaml config --format json | jq -r '.services[] | select(.build) | .build.dockerfile'); do
            test -f "$file" || { echo "compose.production.yaml 引用的 $file 不存在"; exit 1; }
          done
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # 端到端测试：启动 API 和前端开发服务器，用浏览器走一遍联机和单机的主要流程。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - run: npm run build
      - run: npm run generate -w @zhuifen/web
        env:
          NUXT_SPA: 'true'
          NUXT_PUBLIC_API_ORIGIN: https://api.example.com
  package-and-deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: zhuifen-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t zhuifen-api:$GITHUB_SHA .
      - name: Build Nuxt image
        run: docker build -f deploy/Dockerfile.web -t zhuifen-web:$GITHUB_SHA .
      - name: Deploy to domestic server
        if: vars.DEPLOY_ENABLED == 'true'
        run: bash scripts/deploy-ssh.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
