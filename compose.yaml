services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhuifen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - zhuifen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zhuifen"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  zhuifen_pg:
